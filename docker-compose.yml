services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:devdevkey123==
    volumes:
      - azurite_data:/data

  uploader:
    build:
      context: .
      dockerfile: Dockerfile.uploader
    depends_on:
      - azurite
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=devdevkey123==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - azurite
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=devdevkey123==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    ports:
      - "5001:5000"
    restart: always
    tty: true

  frontend:
    image: nginx:alpine
    container_name: coffeeshop_frontend
    depends_on:
      - api
    ports:
      - "8081:80"
    volumes:
      - ./StaticAssets:/usr/share/nginx/html:ro

volumes:
  azurite_data:
    driver: local
