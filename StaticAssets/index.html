<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bean & Brew</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <img src="logo.png" alt="Bean & Brew logo" class="brand-logo" />
        <div>
          <p class="eyebrow">Coffee House</p>
          <h1>Bean & Brew</h1>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div class="panel-header">
          <h2>Today's menu</h2>
          <button id="refreshBtn">Refresh menu</button>
        </div>
        <div id="menuContainer" class="menu-grid"></div>
      </section>

      <section class="panel actions">
        <h2>Order</h2>
        <button id="buyCoffeeBtn" class="primary-btn">Buy coffee</button>
        <div id="orderStatus" class="status-box">Waiting for action...</div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
